[project]
name = "sort-memories"
version = "0.8.2"
description = "Desktop app to sort and dedupe local media folders (macOS, soon multi-platform)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eliott Bouquerel" }]
keywords = ["media", "sort", "dedupe", "photo", "video", "heic", "macos", "desktop", "clip", "phash"]

dependencies = [
    "flask>=3.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "imagehash>=4.3",
    "numpy>=1.26",
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "pywebview>=5.0",
    "appdirs>=1.4",
    "send2trash>=1.8",
    "rawpy>=0.21",
    "exifread>=3.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.5",
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Lyot7/sort-memories"
Repository = "https://github.com/Lyot7/sort-memories"
Issues = "https://github.com/Lyot7/sort-memories/issues"

[project.scripts]
sort-memories = "sort_memories.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sort_memories*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

# core.py contient toute l'UI (HTML/CSS/JS) embarquee dans la string PAGE :
# les longues lignes (E501), imports tardifs apres setup des chemins (E402) et
# le style "try/except/pass" defensif (SIM) y sont assumes. On garde F (vrais
# bugs), E9, UP et B actifs partout. updater.py : longues URLs + suppress defensif.
[tool.ruff.lint.per-file-ignores]
"sort_memories/core.py"    = ["E501", "E402", "SIM105", "SIM102", "SIM115"]
"sort_memories/updater.py" = ["E501", "SIM105"]
